# Real projects that bugs are injected into. Each is pinned to a commit so task
# sets are reproducible. Criteria: pure Python, a fast pytest suite, and few
# dependencies. The target itself is never installed: tests import the sandbox
# copy through `pythonpath`, so the injected bug is what the tests exercise.

[[target]]
name = "toolz"
repo = "https://github.com/pytoolz/toolz"
commit = "451af60dec590a6010e2babdbf391ea8f815122f"
source_dirs = ["toolz"]
exclude = ["toolz/tests", "toolz/curried", "toolz/sandbox"]
test_command = ["python", "-m", "pytest", "toolz/tests"]
requirements = ["pytest>=8"]

[[target]]
name = "boltons"
repo = "https://github.com/mahmoud/boltons"
commit = "d31d821d56c8f7756af9c30a864077f2e5855321"
source_dirs = ["boltons"]
test_command = ["python", "-m", "pytest", "tests"]
requirements = ["pytest>=8"]

[[target]]
name = "python-slugify"
repo = "https://github.com/un33k/python-slugify"
commit = "4b6b5b42f050f1ce96899e015247d5e3901cc433"
source_dirs = ["slugify"]
test_command = ["python", "-m", "pytest", "tests"]
requirements = ["pytest>=8", "text-unidecode>=1.3"]

[[target]]
name = "python-tabulate"
repo = "https://github.com/astanin/python-tabulate"
commit = "268615a5c27dc40e5c22454c07b44d5c50410da0"
source_dirs = ["tabulate"]
test_command = ["python", "-m", "pytest", "test"]
requirements = ["pytest>=8", "wcwidth>=0.6.0"]

[[target]]
name = "inflect"
repo = "https://github.com/jaraco/inflect"
commit = "2084a52769175d8159474779f7cfa71f08f2f911"
source_dirs = ["inflect"]
test_command = ["python", "-m", "pytest", "tests"]
requirements = [
  "pytest>=8",
  "pygments",
  "jaraco.functools",
  "more_itertools>=8.5.0",
  "typeguard>=4.0.1",
]
