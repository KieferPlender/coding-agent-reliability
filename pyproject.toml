[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "coding-agent-reliability"
version = "0.1.0"
description = "Measure how reliably coding agents fix freshly injected bugs, local models vs APIs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kiefer Plender" }]
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=2"]
dev = ["pytest>=8", "ruff>=0.6", "anthropic>=2"]

[project.scripts]
car = "car.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/car"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
markers = ["docker: needs a running Docker daemon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
